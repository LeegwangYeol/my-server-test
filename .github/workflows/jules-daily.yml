name: Jules Daily Check

on:
  schedule:
    # INFO : GitHub evaluates cron in UTC; this fires at 06:00 KST
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 30

      - name: Build prompt
        env:
          PROMPT: |
            You are the daily health checker for this repository.

            ## Goal
            Find ONE real defect and fix it in a small, safe pull request.
            If nothing qualifies, make no changes and open no pull request.

            ## Working alone
            - No human will answer during this run. Never ask questions or wait for input;
              decide yourself using the priority order below.
            - If you cannot settle on a safe fix, finish without changes and without a pull request.

            ## What to look for, in priority order
            1. Build or test failures. Install the project's dependencies first
               (for example `npm ci`, `bun install`, `pip install -r requirements.txt`),
               then run the project's build and test commands.
            2. Bugs: null/undefined dereference, off-by-one, unhandled errors, resource leaks, race conditions.
            3. Security: hard-coded secrets, injection, unsafe deserialization, vulnerable dependency usage.
            4. Regressions introduced by the recent commits listed below.

            ## Not defects
            - Failures caused only by missing secrets or environment variables
              (for example an unset database URL or API key in this environment).
            - Code whose intent is stated in a commit message. Read the commit messages
              (the log below and `git log`) before calling something a bug.

            ## Rules
            - Fix bugs only. Do not change intended behavior, public APIs, or design.
            - Do not refactor, reformat, rename, or update dependencies unless that is the fix itself.
            - Keep the change under 100 lines and run the tests before opening the pull request.
            - A problem that needs a design decision is not yours to fix: leave the code alone and
              list it under "Not fixed" in the pull request body.

            ## Pull request format
            Title: "[Jules daily] <one-line summary>"
            Body, in English, one fact per line:
            - What was wrong (file and line)
            - The fix
            - How it was verified (build/test command and result)
            - Not fixed (problems that need a decision), or "none"
        run: |
          printf '%s\n' "$PROMPT" > prompt.txt
          {
            printf '\n\nLog of the last 20 commits (in the format of `git log --stat`):\n```\n'
            git log -20 --stat
            printf '```\n'
          } >> prompt.txt

      - name: Start Jules session
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          # INFO : scheduled runs start from the default branch, manual runs from the branch picked in the Run dialog
          STARTING_BRANCH: ${{ github.ref_name }}
        run: |
          if [ -z "$JULES_API_KEY" ]; then
            echo "::error::JULES_API_KEY secret is not set"
            exit 1
          fi

          # INFO : --rawfile reads the prompt from disk, so a long commit log cannot hit the argument size limit
          jq -n --rawfile prompt prompt.txt \
                --arg source "sources/github/$GITHUB_REPOSITORY" \
                --arg branch "$STARTING_BRANCH" \
                '{prompt: $prompt,
                  sourceContext: {source: $source, githubRepoContext: {startingBranch: $branch}},
                  requirePlanApproval: false,
                  automationMode: "AUTO_CREATE_PR"}' > payload.json

          # INFO : --fail-with-body makes an HTTP error fail the step while keeping the API's error message
          if ! curl -sS --fail-with-body https://jules.googleapis.com/v1alpha/sessions \
                 -H "Content-Type: application/json" \
                 -H "X-Goog-Api-Key: $JULES_API_KEY" \
                 -d @payload.json -o response.json; then
            echo "::error::Jules API rejected the request"
            cat response.json
            exit 1
          fi

          url="$(jq -r '.url // empty' response.json)"
          if [ -z "$url" ]; then
            echo "::error::Jules API response has no session URL"
            cat response.json
            exit 1
          fi
          echo "Jules session: $url"
